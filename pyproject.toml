[project]
name = "resume-ai"
version = "1.0.0"
description = "AI-powered resume parser using FastAPI, PDFPlumber, and Azure OpenAI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
"fastapi",
"uvicorn",
"pdfplumber",
"pydantic",
"python-dotenv",
"openai",
"python-multipart"
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
reload = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
